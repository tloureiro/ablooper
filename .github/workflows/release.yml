name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching package.json (for example v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Validate version and changelog
        id: version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node scripts/validate-release.js "$TAG" >> "$GITHUB_OUTPUT"
      - name: Require a tested commit on master and prevent retagging
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/master
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          if git rev-parse --verify "refs/tags/$TAG" > /dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          fi

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package static app and create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          tar -czf "$RUNNER_TEMP/ablooper-$TAG.tar.gz" index.html styles.css src
          gh release create "$TAG" "$RUNNER_TEMP/ablooper-$TAG.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AB Looper $TAG" --generate-notes
